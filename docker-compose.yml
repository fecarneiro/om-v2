services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: order_manager
      POSTGRES_PASSWORD: order_manager
      POSTGRES_DB: order_manager
    command: postgres -c timezone=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_manager -d order_manager"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: order_manager
      POSTGRES_PASSWORD: order_manager
      POSTGRES_DB: order_manager_test
    command: postgres -c timezone=America/Sao_Paulo
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_manager -d order_manager_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: sh -c "pnpm db:migrate && pnpm db:setup && pnpm dev"
    environment:
      DATABASE_URL: postgres://order_manager:order_manager@db:5432/order_manager
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/api/src
      - ./api/drizzle:/app/api/drizzle
      - ./contracts/src:/app/contracts/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
