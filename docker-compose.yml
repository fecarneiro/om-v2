services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: order_manager
      POSTGRES_PASSWORD: order_manager
      POSTGRES_DB: order_manager
    command: postgres -c timezone=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_manager"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
